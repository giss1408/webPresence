<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Base href for routing (replaced by `flutter build web --base-href`) -->
  <base href="$FLUTTER_BASE_HREF">

  <title>Regisse__ #Business Solutions — Solutions digitales pour l'Afrique</title>
  <meta name="description" content="Regisse__ #Business Solutions — ingénierie allemande au service de vos projets digitaux en Afrique : plateformes SaaS sur mesure, design UI/UX, applications mobile-first.">
  <meta name="author" content="Regisse__ GmbH">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://regisse.de/">
  <meta name="theme-color" content="#1389FD">
  <meta name="color-scheme" content="light">

  <!-- Open Graph / social sharing (absolute URLs are required by crawlers) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://regisse.de/">
  <meta property="og:site_name" content="Regisse__">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Regisse__ #Business Solutions — Solutions digitales pour l'Afrique">
  <meta property="og:description" content="Ingénierie allemande au service de vos projets en Afrique — des plateformes SaaS sécurisées, mobile-first et livrées en quelques semaines.">
  <meta property="og:image" content="https://regisse.de/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Regisse__ #Business Solutions — Solutions digitales pour l'Afrique">
  <meta name="twitter:description" content="Ingénierie allemande au service de vos projets en Afrique — des plateformes SaaS sécurisées, mobile-first et livrées en quelques semaines.">
  <meta name="twitter:image" content="https://regisse.de/icons/Icon-512.png">

  <!-- Icons & PWA -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Regisse__">
  <link rel="manifest" href="manifest.json">

  <!-- CanvasKit is fetched from gstatic; warm the connection up. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="script" href="flutter_bootstrap.js">
  <!-- The app itself: start downloading now instead of after the bootstrap
       script runs (one round trip less on high-latency mobile networks). -->
  <link rel="preload" as="script" href="main.dart.js">
  <!-- Flutter only asks for these once main.dart.js has downloaded and
       started, one request after another. Fetch them now, in parallel; the
       engine's fetch() reuses these responses. Keep in sync with the
       fonts in pubspec.yaml and the first carousel slide. -->
  <link rel="preload" as="fetch" crossorigin href="assets/FontManifest.json">
  <link rel="preload" as="fetch" crossorigin href="assets/AssetManifest.bin.json">
  <link rel="preload" as="fetch" crossorigin href="assets/assets/fonts/product_sans_regular.ttf">
  <link rel="preload" as="fetch" crossorigin href="assets/assets/fonts/product_sans_bold.ttf">
  <link rel="preload" as="fetch" crossorigin href="assets/assets/fonts/roboto_regular.ttf">
  <link rel="preload" as="fetch" crossorigin href="assets/assets/fonts/roboto_bold.ttf">
  <!-- First screen's images, at low priority so they don't slow the above. -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/assets/images/logo.svg">
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/packages/country_flags/res/si/ci.si">
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/assets/images/device_frame.webp">
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/assets/images/abidjan-web.webp">
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/assets/images/slide_1-layer_1_Test.webp">
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="assets/assets/images/slide_1-layer_2_Test.webp">

  <!-- Branded loading screen, shown until Flutter paints its first frame.
       Light, like the app's default theme. -->
  <style>
    :root { --bg: #F9FAFB; --fg: #64748B; --track: #E5E7EB; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: var(--bg); color: var(--fg);
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash svg { width: 64px; height: 64px; }
    #splash h1 {
      margin: 0; max-width: 560px; padding: 0 16px; text-align: center;
      color: #1E293B; font-size: clamp(20px, 5vw, 28px); line-height: 1.25;
    }
    #splash .tagline { margin: 0; max-width: 480px; padding: 0 16px; text-align: center; }
    #splash .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--track); border-top-color: #1389FD;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #slow { display: none; max-width: 300px; padding: 0 16px; text-align: center; font-size: 13px; }
    #slow.shown { display: block; }
    #slow a { color: #1389FD; }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 3s; } }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Regisse__",
    "url": "https://regisse.de",
    "logo": "https://regisse.de/icons/Icon-512.png",
    "description": "Ingénierie allemande au service de vos projets digitaux en Afrique : plateformes SaaS sur mesure, design UI/UX et applications mobile-first.",
    "address": { "@type": "PostalAddress", "addressLocality": "Berlin", "addressCountry": "DE" },
    "contactPoint": { "@type": "ContactPoint", "email": "contact@regisse.de", "contactType": "sales" },
    "sameAs": ["https://www.youtube.com/@regisse"]
  }
  </script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="7" fill="#1389FD"/>
      <polyline points="9,14 19,20 9,26" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="20,14 30,20 20,26" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
    </svg>
    <!-- Real text while the app loads: visitors read the pitch right away,
         and crawlers (which can't see Flutter's canvas) index it. -->
    <h1>L'excellence technique allemande au service de vos projets en Afrique</h1>
    <p class="tagline">Applications mobiles, plateformes SaaS et design sur mesure — livrés en quelques semaines.</p>
    <div class="spinner"></div>
    <span>Regisse__ #Business Solutions</span>
    <!-- Shown if loading takes long (slow mobile networks): visitors can
         still reach us instead of leaving. -->
    <p id="slow">
      Connexion lente : le site continue de charger…<br>
      Slow connection — still loading…<br><br>
      <a href="mailto:contact@regisse.de">contact@regisse.de</a>
    </p>
  </div>
  <noscript>Ce site nécessite JavaScript. — This website requires JavaScript.</noscript>

  <script>
    var slowTimer = setTimeout(function () {
      document.getElementById('slow').classList.add('shown');
    }, 8000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowTimer);
      var splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
