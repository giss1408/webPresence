# Render Blueprint — https://render.com/docs/blueprint-spec
# Static site from the committed `web/` folder, served from Render's CDN.
# Regenerate pages locally with `dart run tool/generate_site.dart` before committing.
services:
  - type: web
    name: regisse
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: web
    pullRequestPreviewsEnabled: false
    routes:
      # Retired offer: send old links home.
      - type: redirect
        source: /due-diligence-technique
        destination: /
      - type: redirect
        source: /due-diligence-technique/*
        destination: /
      - type: redirect
        source: /en/tech-due-diligence
        destination: /en/
      - type: redirect
        source: /en/tech-due-diligence/*
        destination: /en/
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # HTML, CSS and JS file names are not content-hashed: revalidate on every visit.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
