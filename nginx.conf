server {
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers (same as render.yaml).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Flutter SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        # Flutter's file names are not content-hashed: revalidate the entry
        # points on every visit so a deploy is picked up immediately.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images, fonts and CanvasKit: cache for a day, serve stale while updating.
    location ~ ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
}
