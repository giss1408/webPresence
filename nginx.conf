server {
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Retired offer: send old links home.
    location ^~ /due-diligence-technique { return 301 /; }
    location ^~ /en/tech-due-diligence { return 301 /en/; }

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
        # HTML, CSS and JS are not content-hashed: revalidate every visit.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip            on;
    gzip_comp_level 6;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/manifest+json image/svg+xml font/ttf;
    gzip_min_length 1024;
}
